name: Post Instagram Story

on:
  schedule:
    - cron: '0 23 * * *'  # バックアップ: 毎日 08:00 JST（cron-job.orgが失敗した場合の保険）
  workflow_dispatch:  # 手動実行（テスト用）

jobs:
  post-story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests jpholiday

      - name: Check required secrets
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          if [ -z "$INSTAGRAM_ACCESS_TOKEN" ]; then
            echo "::error::シークレット INSTAGRAM_ACCESS_TOKEN が未設定です。Settings > Secrets and variables > Actions で登録してください。"
            exit 1
          fi
          if [ -z "$INSTAGRAM_USER_ID" ]; then
            echo "::error::シークレット INSTAGRAM_USER_ID が未設定です。Settings > Secrets and variables > Actions で登録してください。"
            exit 1
          fi
          echo "シークレット確認 OK"

      - name: Post Instagram Story
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python post_story.py
